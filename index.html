    <script>
      // Experiment: lock the layout viewport to 700px on devices whose CSS
      // screen width is 700px or less. Tablets and desktops keep device-width.
      // document.write during head parse so the browser commits to the right
      // viewport on the first layout — mutating an existing meta after parse
      // leaves DevTools' mobile emulation stuck at the original width.
      (function () {
        var narrow = window.screen && window.screen.width <= 700;
        var content = narrow
          ? 'width=700'
          : 'width=device-width, initial-scale=1.0, viewport-fit=cover';
        document.write('<meta name="viewport" content="' + content + '">');
      })();
    </script>
